<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Az oldal nem található | Vibe Park</title>

    <link rel="stylesheet" href="style/main.css">

    <style>
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#0f1118;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        .error-container{
            text-align:center;
            padding:40px 20px;
        }

        .error-logo{
            width:180px;
            max-width:80%;
            margin-bottom:30px;
        }

        h1{
            font-size:5rem;
            margin:0;
            color:#34c8e8;
        }

        h2{
            margin:15px 0;
            font-size:2rem;
        }

        p{
            max-width:500px;
            margin:0 auto 35px;
            color:#cfcfcf;
            line-height:1.6;
        }

        .home-btn{
            display:inline-block;
            padding:15px 35px;
            background:#ff3f98;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        .home-btn:hover{
            background:#34c8e8;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <main class="error-container">

        <img src="img/logo/logo.png" alt="Vibe Park Logo" class="error-logo">

        <h1>404</h1>

        <h2>Az oldal nem található</h2>

        <p>
            Sajnáljuk, de a keresett oldal nem létezik, vagy áthelyeztük.
        </p>

        <a href="index.html" class="home-btn">
            ← Vissza a főoldalra
        </a>

    </main>

</body>
</html>
